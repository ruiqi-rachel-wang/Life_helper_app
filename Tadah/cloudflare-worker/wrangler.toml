name = "cuevi-ai"
main = "worker.js"
compatibility_date = "2026-08-01"

# Request/error sampling in the Cloudflare dashboard. Without it, a failing
# /sync or a spike in AI spend is invisible until a tester reports it.
[observability]
enabled = true

# Secrets are NOT here — set each with `wrangler secret put <NAME>` (never in git):
#   OPENAI_API_KEY     — the OpenAI key the AI proxy adds server-side.
#   PROXY_TOKEN        — shared app↔Worker token (X-Cuevi-Token), gates every route.
# Account task sync (Part 3) adds two more:
#   REVENUECAT_SECRET  — RevenueCat REST *secret* key; the Worker checks Plus tier
#                        authoritatively (GET /v1/subscribers/<appUserId>).
#
# Email + password auth (Part 3b). ⚠️ ALL THREE REQUIRED — each FAILS CLOSED
# (503 or throw) rather than degrading, because every earlier version of this
# section had a "sensible fallback" that silently weakened security.
#   PASSWORD_PEPPER    — ⚠️ REQUIRED. The HMAC key every password verifier and
#                        reset code is derived through, and the reason a stolen
#                        `accounts` table can't be attacked offline. NO default:
#                        without it /auth/email/* returns 503. Generate once with
#                        `openssl rand -base64 32` and NEVER change it — rotating
#                        invalidates every stored password at once.
#                        wrangler secret put PASSWORD_PEPPER
#   RESEND_KEY         — ⚠️ REQUIRED for password reset. Resend API key. Never
#                        paste it into a file; one that reaches git or a chat log
#                        should be revoked and replaced, because it can send mail
#                        as you and burn your domain's sending reputation.
#                        wrangler secret put RESEND_KEY
#   EMAIL_FROM         — ⚠️ REQUIRED, not optional. e.g. noreply@mytadah.com, on a
#                        domain VERIFIED in Resend. It used to fall back to the
#                        shared onboarding@resend.dev, which only delivers to the
#                        Resend account owner — so a real user was told "check
#                        your inbox" for a code that could never arrive.
#                        wrangler secret put EMAIL_FROM
#
# APPLE_* SECRETS ARE NO LONGER NEEDED. Sign in with Apple was removed on
# 2026-08-15: the /auth/apple route went then (a route test pins the 404), and the
# JWKS cache, nonce table, ES256 client-secret minting, base64url/PEM helpers and
# the grant-revocation step of /account/delete followed on 2026-08-16 — worker.js
# now contains no Apple code path at all. It authenticated the DEVICE's Apple ID,
# so a family member could never reach a shared account. Delete the secrets with
# `wrangler secret delete <NAME>`:
# APPLE_AUDIENCE, APPLE_TEAM_ID, APPLE_KEY_ID, APPLE_PRIVATE_KEY.
# After adding the sync tables run once:
#   wrangler d1 execute cuevi-metrics --remote --file=schema.sql
# (Re-run it after pulling the session changes: `sessions` gains plus_checked_at.
#  The Worker also creates these lazily, so the manual run is belt-and-braces.
#  An already-deployed database keeps its now-unused `used_nonces` table and its
#  `account_deletions.apple_revoked` column; nothing reads either, and they can be
#  dropped by hand whenever convenient.)

# Anonymous tester metrics storage (Part 1). One-time setup:
#   1) wrangler d1 create cuevi-metrics
#   2) paste the printed database_id below
#   3) wrangler d1 execute cuevi-metrics --remote --file=schema.sql
#   4) wrangler deploy
# Free tier; never calls OpenAI. See how_to_view_tester_data.md.
[[d1_databases]]
binding = "DB"               # how worker.js refers to it: env.DB
database_name = "cuevi-metrics"
database_id = "5e803b6a-8d38-4388-a4b8-23a0e4fa3122"

# Rate limit (worker-level, before any body parsing). 60 requests/min is far above
# honest app use (a scan = 1 call) and bounds bursts from a leaked token.
#
# worker.js keys this on the SESSION TOKEN, else the install id, else the IP —
# IP-only keying punished everyone behind one carrier NAT or school network for
# the noisiest person on it. worker.js skips the check if this binding is missing,
# so removing it degrades gracefully. `namespace_id` is just a local identifier
# (any unique int per limiter in this Worker).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
